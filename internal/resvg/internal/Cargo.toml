[package]
name = "resvg"
version = "0.1.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]
path = "resvg.rs"

[dependencies]
resvg = { version = "0.45.0", default-features = false, features = [ "text", "raster-images"  ] }
fontdb = { version = "0.23", default-features = false, features = [ "fs" ] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
# Local fix: guard an out-of-bounds removal in usvg's per-glyph font fallback
# (panics on ZWJ emoji sequences adjacent to regular text). See the comment at
# the patch site in vendor/usvg/src/text/layout.rs.
[patch.crates-io]
usvg = { path = "vendor/usvg" }

---
name: release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
